# The trainer is a static site with hash routes (#/5x5/l2c), so every page is index.html
# and there's no fallback to configure. The edge Caddy stack terminates HTTPS in front.
server {
    listen 8000;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The container's health check, and the pull deploy's, via the image's HEALTHCHECK.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite puts a content hash in every asset's file name, so they never change in place.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
    }
}
